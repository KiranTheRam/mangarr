[project]
name = "mangarr"
version = "0.1.1"
description = "Radarr/Sonarr-style automation for manga and comics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "sqlalchemy>=2.0.54",
    "greenlet>=3.5",
    "aiosqlite>=0.22",
    "httpx>=0.28",
    "beautifulsoup4>=4.15",
    "lxml>=6.1",
    "soupsieve>=2.9",
    "apscheduler>=3.11,<4",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-multipart>=0.0.32",
    "mwparserfromhell>=0.7.2",
    "mini-racer>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
]

[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mangarr*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
