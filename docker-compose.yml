services:
  mangarr:
    image: kirantheram/mangarr:latest
    container_name: mangarr
    ports:
      - "6996:6996"
    environment:
      # Keep existing environment-managed logins. New installs use browser setup.
      MANGARR_AUTH_USERNAME: ${MANGARR_AUTH_USERNAME:-}
      MANGARR_AUTH_PASSWORD: ${MANGARR_AUTH_PASSWORD:-}
      # Optional file ownership and permissions for new files.
      # PUID: "1000"
      # PGID: "1000"
      # UMASK: "002"
    volumes:
      - ./data/mangarr-config:/config
      # Mount the same media path in your existing qBittorrent container so
      # Mangarr can import completed downloads and hardlink them into the library.
      - ./data/media:/media
    restart: unless-stopped
